<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <div class="container">
        <table class="table">
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">PLAYFAIR CIPHER</td>
            </tr>
            <tr>
                <td style="font-weight: bold; color: blue">ENCRYPTION</td>
            </tr>
            <td>
                <form method="POST" action="/create_matrix">
                    <div class="mb-3">
                        <label class="form-lable">Key:</label>
                        <input type="text" class="form-control" name="inputKey" placeholder="Input Key" require>
                    </div>
                    <button type="submit" class="btn btn-primary">Create matrix</button>
                </form>
            </td>
            <tr>
            
                <td>
                    <form method="POST" action="/playfair_encrypt">
                        <div class="mb-3">
                            <label class="form-lable">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-lable">Key:</label>
                            <input type="text" class="form-control" name="inputKeyPlain" placeholder="Input Key" require>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>
            <tr>
                <td style="font-weight: bold; color:blue">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="/playfair_decrypt">
                        <div class="mb-3">
                            <label class="form-lable">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Plain Text" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-lable">Key:</label>
                            <input type="text" class="form-control" name="inputKeyCipher" placeholder="Input Key" require>
                        </div>
                        <button type="submit" class="btn btn-primary">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
